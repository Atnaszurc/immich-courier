# Vet and test on every push and pull request, on all three platforms.
# The FIFO and symlink tests only run on Linux/macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # The Windows icon and manifest resources are committed as .syso files.
  # Check that they still rebuild byte for byte from the sources in winres/.
  # On Windows, because the go:generate lines live in a Windows-only file and
  # also build and run a helper tool (GOOS=windows elsewhere would build that
  # helper for the wrong OS).
  windows-resources:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Regenerate and compare
        run: |
          go generate ./cmd/immich-courier
          git diff --exit-code -- cmd/immich-courier
