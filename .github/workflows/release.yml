# Builds release binaries when a version tag (v1.2.3) is pushed, and creates
# a draft GitHub Release with them, a SHA256SUMS file and build provenance
# attestations. Review the draft, then publish it.
#
# Binaries are not code-signed (see README "Downloads"). macOS arm64 code
# gets the ad-hoc signature Go's linker always adds; nothing more.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Windows and Linux are pure Go (the tray uses DBus on Linux), so one
  # Linux runner cross-compiles both.
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # release builds start clean
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          name="immich-courier-${VERSION}-${GOOS}-${GOARCH}"
          exe=immich-courier; [ "$GOOS" = windows ] && exe=immich-courier.exe
          mkdir -p "pkg/$name" dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "pkg/$name/$exe" ./cmd/immich-courier
          cp LICENSE README.md SECURITY.md "pkg/$name/"
          cd pkg
          if [ "$GOOS" = windows ]; then
            zip -qr "../dist/$name.zip" "$name"
          else
            tar -czf "../dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # The macOS tray needs CGO, so it builds on a Mac. Both architectures are
  # built on the (Apple Silicon) runner and joined into one universal binary,
  # shipped as immich-courier.app (an app bundle gets its own Local Network
  # permission and prompt; a bare binary started at login does not).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          VERSION: ${{ github.ref_name }}
        run: |
          flags=(-trimpath -ldflags "-s -w -X main.version=${VERSION}")
          GOARCH=arm64 CC="clang -arch arm64" go build "${flags[@]}" -o build/arm64 ./cmd/immich-courier
          GOARCH=amd64 CC="clang -arch x86_64" go build "${flags[@]}" -o build/amd64 ./cmd/immich-courier
          lipo -create -output build/immich-courier build/arm64 build/amd64
          lipo -info build/immich-courier
      - name: Assemble immich-courier.app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app=build/immich-courier.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/immich-courier "$app/Contents/MacOS/immich-courier"
          # Bundle versions must be numbers: v1.2.3-test -> 1.2.3
          version=$(echo "${TAG#v}" | sed -E 's/^([0-9]+(\.[0-9]+){0,2}).*/\1/')
          sed -e "s/__VERSION__/${version}/g" -e "s/__TAG__/${TAG}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          go run ./tools/winicon -iconset build/AppIcon.iconset
          iconutil -c icns -o "$app/Contents/Resources/AppIcon.icns" build/AppIcon.iconset
          # Ad-hoc signature (no Apple Developer ID): seals Info.plist and
          # resources to the binary, which macOS needs to treat it as one app.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Format|Signature"
      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          name="immich-courier-${VERSION}-macos"
          mkdir -p "pkg/$name" dist
          ditto build/immich-courier.app "pkg/$name/immich-courier.app"
          cp LICENSE README.md SECURITY.md "pkg/$name/"
          # ditto keeps the bundle's extended attributes and signature intact.
          ditto -c -k --keepParent "pkg/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [cross, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes
